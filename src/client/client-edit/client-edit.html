<div class="container">
    @if (id()) {
        <h1>Editar Cliente</h1>
    } @else {
        <h1>Crear Cliente</h1>
    }
    <form>
        <mat-form-field>
            <mat-label>Identificador</mat-label>
            <input type="text" matInput placeholder="Identificador" [(ngModel)]="id" name="id" disabled>
        </mat-form-field>

        <mat-form-field>
            <mat-label>Nombre</mat-label>
            <input type="text" matInput placeholder="Nombre" [(ngModel)]="name" name="name" required>
            <mat-error>El nombre es obligatorio</mat-error>
        </mat-form-field>
    </form>

    <div class="buttons">
        <button mat-stockerd-button (click)="onClose()">Cerrar</button>
        <button mat-flat-button color="primary" (click)="onSave()">Guardar</button>
    </div>
</div>
